http_server: "http://kube.aradarpanet.ir"
registry_host: "kube.aradarpanet.ir"

local_release_dir: "/tmp/releases"
image_arch: "amd64"

kube_version: "1.37.1"
runc_version: "1.3.4"
cni_version: "1.6.0"
crictl_version: "1.32.0"
calico_ctl_version: "3.29.1"
pod_infra_version: "3.10"
coredns_version: "1.12.0"
etcd_version: "3.5.17"
etcd_image_tag: "3.5.17-0"

runc_binary_checksum: ""
kubeadm_binary_checksum: ""
kubectl_binary_checksum: ""
kubelet_binary_checksum: ""
etcd_binary_checksum: ""
cni_binary_checksum: ""
crictl_binary_checksum: ""
calicoctl_binary_checksum: ""

containerd_registries_mirrors:
  - prefix: "{{ registry_host }}"
    mirrors:
      - host: "http://{{ registry_host }}"
        capabilities: ["pull", "resolve"]
        skip_verify: true

files_repo: "https://registry.aradarpanet.ir/repository/raw-files"
download_validate_certs: false
yum_repo: "{{ http_server }}/rpms"
ubuntu_repo: "{{ http_server }}/debs"

kube_image_repo: "{{ registry_host }}"
gcr_image_repo: "{{ registry_host }}"
docker_image_repo: "{{ registry_host }}"
quay_image_repo: "{{ registry_host }}"
github_image_repo: "{{ registry_host }}"

local_path_provisioner_helper_image_repo: "{{ registry_host }}/busybox"

kubeadm_download_url: "{{ files_repo }}/kubernetes/v{{ kube_version }}/kubeadm"
kubectl_download_url: "{{ files_repo }}/kubernetes/v{{ kube_version }}/kubectl"
kubelet_download_url: "{{ files_repo }}/kubernetes/v{{ kube_version }}/kubelet"

etcd_download_url: "{{ files_repo }}/etcd/etcd-v{{ etcd_version }}-linux-{{ image_arch }}.tar.gz"

cni_download_url: "{{ files_repo }}/cni-plugins/cni-plugins-linux-{{ image_arch }}-v{{ cni_version }}.tgz"
crictl_download_url: "{{ files_repo }}/cri-tools/crictl-v{{ crictl_version }}-{{ ansible_system | lower }}-{{ image_arch }}.tar.gz"

calicoctl_download_url: "{{ files_repo }}/calicoctl/calicoctl-linux-{{ image_arch }}"
calico_crds_download_url: "{{ files_repo }}/kubernetes/calico/crds.yaml"

ciliumcli_download_url: "{{ files_repo }}/cilium-cli/v{{ cilium_cli_version }}/cilium-linux-{{ image_arch }}.tar.gz"

helm_download_url: "{{ files_repo }}/helm/helm-v{{ helm_version }}-linux-{{ image_arch }}.tar.gz"

crun_download_url: "{{ files_repo }}/crun-{{ crun_version }}-linux-{{ image_arch }}"

kata_containers_download_url: "{{ files_repo }}/kata-static-{{ kata_containers_version }}-{{ image_arch }}.tar.xz"

runc_download_url: "{{ files_repo }}/runc/v{{ runc_version }}/runc.{{ image_arch }}"
nerdctl_download_url: "{{ files_repo }}/nerdctl-{{ nerdctl_version }}-{{ ansible_system | lower }}-{{ image_arch }}.tar.gz"
containerd_download_url: "{{ files_repo }}/containerd/containerd-{{ containerd_version }}-linux-{{ image_arch }}.tar.gz"

crio_download_url: "{{ files_repo }}/cri-o.{{ image_arch }}.v{{ crio_version }}.tar.gz"
skopeo_download_url: "{{ files_repo }}/skopeo/v{{ skopeo_version }}/skopeo-linux-{{ image_arch }}"

gvisor_runsc_download_url: "{{ files_repo }}/gvisor/{{ gvisor_version }}/{{ ansible_architecture }}/runsc"
gvisor_containerd_shim_runsc_download_url: "{{ files_repo }}/gvisor/{{ gvisor_version }}/{{ ansible_architecture }}/containerd-shim-runsc-v1"

youki_download_url: "{{ files_repo }}/youki-{{ youki_version }}-{{ ansible_architecture }}-gnu.tar.gz"
yq_download_url: "{{ files_repo }}/yq/v{{ yq_version }}/yq_linux_{{ image_arch }}"

cri_dockerd_download_url: "{{ files_repo }}/cri-dockerd-{{ cri_dockerd_version }}.{{ image_arch }}.tgz"

gateway_api_crds_download_url: "{{ files_repo }}/standard-install.yaml"

prometheus_operator_crds_download_url: "{{ files_repo }}/stripped-down-crds.yaml"
